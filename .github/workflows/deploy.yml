# Tests auf jedem Pull Request, Deployment bei jedem Push auf main.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Erlaubt einen Deploy von Hand über den Actions-Tab, ohne Commit.
  workflow_dispatch:

permissions:
  contents: read

# Zwei Deployments gleichzeitig würden sich gegenseitig überholen.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Cloudflare Worker
    # Ein roter Test hält das Deployment auf; Pull Requests deployen nie.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Die im Projekt gepinnte Wrangler-Version, kein fremdes Action-Paket.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
