# Tests auf jedem Pull Request, Deployment bei jedem Push auf main.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Erlaubt einen Deploy von Hand über den Actions-Tab, ohne Commit.
  workflow_dispatch:

permissions:
  contents: read

# Zwei Deployments gleichzeitig würden sich gegenseitig überholen.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Der Demo-Worker lokal, von einem Browser bedient: Anmeldung, Plan, Woche, Sprache, offline.
  # Hält das Deployment nicht auf – ein Browser-Test darf wackeln, ohne die App zu blockieren.
  e2e:
    name: Browser-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  deploy:
    name: Cloudflare Worker
    # Ein roter Test hält das Deployment auf; Pull Requests deployen nie.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Die Worker-Secrets aus GitHub gehen mit dem Deployment an Cloudflare. Nur
      # gesetzte kommen in die Datei; was schon beim Worker liegt, bleibt dort.
      - name: Worker-Secrets sammeln
        run: |
          jq -n 'env | with_entries(select((.key | startswith("BREVO_")) and .value != ""))' \
            > "$RUNNER_TEMP/secrets.json"
          jq -r 'keys[]' "$RUNNER_TEMP/secrets.json"
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_DOI_TEMPLATE_ID: ${{ secrets.BREVO_DOI_TEMPLATE_ID }}
      # Die im Projekt gepinnte Wrangler-Version, kein fremdes Action-Paket.
      - run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Die Demo mit Beispieldaten: eigener Worker (etmal-demo), eigener KV-Namespace, nichts
  # geteilt mit der Produktion. Läuft neben dem Deployment der App und hält es nicht auf.
  deploy-demo:
    name: Demo-Worker
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Nur das Demo-Passwort, und nur wenn es als GitHub-Secret gesetzt ist; sonst bleibt,
      # was mit `wrangler secret put DEMO_PASSWORD --env demo` beim Worker liegt.
      - name: Demo-Secret sammeln
        run: |
          jq -n 'env | with_entries(select(.key == "DEMO_PASSWORD" and .value != ""))' \
            > "$RUNNER_TEMP/demo-secrets.json"
          jq -r 'keys[]' "$RUNNER_TEMP/demo-secrets.json"
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      - run: npx wrangler deploy --env demo --secrets-file "$RUNNER_TEMP/demo-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
