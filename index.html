<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e3e1db" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070909" media="(prefers-color-scheme: dark)" />
    <title>Formkurve – Wahl statt Plan</title>
    <meta
      name="description"
      content="Jeden Tag eine Einheit für jede deiner Sportarten – Rad, Laufen, Schwimmen – plus Kurzfassung. Du wählst spontan, der Trainingsreiz stimmt. Aus deinen intervals.icu-Daten, kostenlos in der Beta."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Formkurve" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:url" content="https://formkurve.org/" />
    <meta property="og:title" content="Formkurve – Wahl statt Plan" />
    <meta
      property="og:description"
      content="Rad oder Laufen, 60 oder 30 Minuten: Du entscheidest spontan, der Trainingsreiz stimmt trotzdem. Für intervals.icu, kostenlos in der Beta."
    />
    <meta property="og:image" content="https://formkurve.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Formkurve: Wahl statt Plan. 60 Minuten Rad oder 45 Minuten Laufen oder 30 Minuten Kurzfassung." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Formkurve – Wahl statt Plan" />
    <meta
      name="twitter:description"
      content="Rad oder Laufen, 60 oder 30 Minuten: Du entscheidest spontan, der Trainingsreiz stimmt trotzdem."
    />
    <meta name="twitter:image" content="https://formkurve.org/og-image.png" />
    <script>
      // Applied before first paint so the page never flashes the other theme.
      // The key is repeated from src/ui/theme.ts: this has to run before any module.
      try {
        var stored = localStorage.getItem('coach:theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored)
        }
      } catch (error) {
        /* storage blocked: the system preference decides */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
